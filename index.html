<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sportnoten</title>
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sportnoten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
@font-face{font-family:'Albert Sans';font-style:normal;font-weight:300;font-display:swap;src:url(fonts/albert-sans-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'Albert Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/albert-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Albert Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/albert-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Albert Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/albert-sans-latin-600-normal.woff2) format('woff2')}
</style>
<style>
/* Layout: eine Spalte am Handy, ab iPad-Breite Schülerliste links + Bewertung rechts. Hallenboden-Grau, Linienblau als Akzent, Linien-Gelb als Markierung. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#15212b; --muted:#5a6771; --line:#d8dcd6; --chip:#eceee9;
  --accent:#1c5bc9; --accent-ink:#ffffff; --mark:#f0c020;
  --good:#1d8148; --mid:#9a6a00; --bad:#bf3626;
  --good-bg:#e3f2e8; --mid-bg:#fbf1d9; --bad-bg:#f8e2de;
  --font-display:'Albert Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Albert Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161c; --surface:#18212a; --ink:#e6ebee; --muted:#9ba8b2; --line:#2b3743; --chip:#212d38;
    --accent:#5c94f2; --accent-ink:#0c1218; --mark:#e3b622;
    --good:#5cc68a; --mid:#e0b04a; --bad:#f07a68;
    --good-bg:#17342a; --mid-bg:#3a3018; --bad-bg:#3e221e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --ink:#e6ebee; --muted:#9ba8b2; --line:#2b3743; --chip:#212d38;
  --accent:#5c94f2; --accent-ink:#0c1218; --mark:#e3b622;
  --good:#5cc68a; --mid:#e0b04a; --bad:#f07a68;
  --good-bg:#17342a; --mid-bg:#3a3018; --bad-bg:#3e221e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:2rem;text-transform:uppercase;line-height:1}
h2{font-size:1.5rem;line-height:1.1}
h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
p{margin:0}
.hint{color:var(--muted);font-size:.92rem}
.num{font-variant-numeric:tabular-nums}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:8px 10px}
button.danger{color:var(--bad)}
button.armed{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:140px;resize:vertical}
label{display:grid;gap:6px;font-weight:600;font-size:.95rem}

.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:3px solid var(--mark);margin-bottom:16px}
.masthead .sub{color:var(--muted);font-size:.95rem}
.pill{display:inline-block;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.notice{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--mark);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.93rem}
.notice p{max-width:65ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.card .meta{color:var(--muted);font-size:.92rem}

.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.topbar h1{font-size:1.7rem}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);padding:6px 0 10px;margin-bottom:6px}
.tabs button{border-radius:10px;font-weight:600;font-size:.95rem;padding:8px 4px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{white-space:nowrap;border-radius:999px}
.chips button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.progress{display:grid;gap:6px}
.bar{height:8px;background:var(--chip);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}

.rate-layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.rate-layout .panel.rating{order:-1}
@media (min-width:820px){
  .rate-layout{grid-template-columns:300px minmax(0,1fr);align-items:start}
  .rate-layout .panel.rating{order:0;position:sticky;top:64px}
}
.students{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
@media (min-width:820px){.students{grid-template-columns:1fr}}
.stu{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border-left-width:5px}
.stu .val{font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem;color:var(--muted)}
.stu.done{border-left-color:var(--good)}
.stu.partial{border-left-color:var(--mid)}
.stu.away{border-left-color:var(--line);color:var(--muted)}
.stu.cur{outline:2px solid var(--accent);outline-offset:-1px;background:var(--chip)}

.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.result{font-family:var(--font-display);font-weight:700;font-size:2.3rem;line-height:1;padding:6px 12px;border-radius:10px;font-variant-numeric:tabular-nums;background:var(--chip)}
.result small{display:block;font-family:var(--font-body);font-weight:500;font-size:.75rem;color:var(--muted);text-align:right}
.tone-good{background:var(--good-bg);color:var(--good)}
.tone-mid{background:var(--mid-bg);color:var(--mid)}
.tone-bad{background:var(--bad-bg);color:var(--bad)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.seg button{border:none;background:transparent;font-weight:600}
.seg button.sel{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}

.crit{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.crit-head{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.crit-head .w{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.scale{display:grid;gap:6px}
.scale-note{grid-template-columns:repeat(6,1fr)}
.scale-punkte{grid-template-columns:repeat(8,1fr)}
.scale button{padding:8px 0;font-weight:600;font-variant-numeric:tabular-nums;min-height:46px}
.scale-note button{min-height:58px;font-size:1.35rem;font-family:var(--font-display)}
.scale button.half{color:var(--muted);font-weight:500}
.scale button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.away-msg{padding:18px;text-align:center;color:var(--muted);background:var(--chip);border-radius:12px}
.actions{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.actions .toggle{color:var(--muted);font-weight:600}
.actions .toggle.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips button.add{border-style:dashed;color:var(--accent);font-weight:600}
button.small{min-height:32px;padding:4px 6px;font-size:.9rem}
.tpl-list{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tpl-list button{text-align:left;font-weight:600}

.crit-edit{display:grid;grid-template-columns:minmax(0,1fr) 140px 44px;gap:6px;align-items:center}
@media (max-width:480px){.crit-edit{grid-template-columns:minmax(0,1fr) 44px}.crit-edit select{grid-column:1;grid-row:2}.crit-edit button{grid-row:1 / span 2;align-self:stretch}}
.crit-edit .tools{display:flex;gap:4px}
.crit-edit .tools button{min-width:40px;padding:8px}
.share{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);margin-top:-2px}
.share .bar{flex:1;height:6px}
.crit-edit-wrap{display:grid;gap:12px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:24px;display:grid;gap:10px;justify-items:start}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--font-display);font-size:1rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
th small{display:block;font-family:var(--font-body);text-transform:none;letter-spacing:0;font-size:.75rem}
td.c,th.c{text-align:center}
td .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:600}
td.total{font-weight:700}
tfoot td{font-weight:600;color:var(--muted);border-bottom:none}
.toast{color:var(--good);font-weight:600}
.error{color:var(--bad);font-weight:600;max-width:65ch}

.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;width:max-content}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer}
.filebtn:focus-within{outline:3px solid var(--mark);outline-offset:2px}
.imp-info{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;color:var(--muted)}
.imp-info strong{color:var(--ink)}
.imp-opts{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.imp-opts label{flex:1 1 200px}
.check{display:flex!important;align-items:center;gap:10px;font-weight:500}
.check input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
.imp-list{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.imp-row{display:flex!important;align-items:center;gap:10px;font-weight:500;padding:8px 12px;border:1px solid var(--line);border-radius:10px;min-height:46px;background:var(--surface)}
.imp-row input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
.imp-row.off{opacity:.5}
#pdf-import{scroll-margin-top:72px}
.imp-actions{position:sticky;bottom:0;background:var(--surface);padding:10px 0 4px;border-top:1px solid var(--line)}
.imp-row small{margin-left:auto;color:var(--mid);font-size:.76rem;text-align:right}


.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.year{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.year.open{padding-bottom:14px}
.year.drop{outline:3px dashed var(--accent);outline-offset:2px}
.year-head{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;font-family:var(--font-display);font-size:1.5rem;font-weight:700;padding:10px 0;text-align:left}
.year-head .chev{width:1em;color:var(--accent)}
.year-head .count{margin-left:auto;font-family:var(--font-body);font-size:.9rem;color:var(--muted);font-weight:500}
.year-body{display:grid;gap:12px}
.year .card{background:var(--bg)}
.course-card{display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:border-color .15s,box-shadow .15s}
.course-card:hover{border-color:var(--accent)}
.course-card:active{background:var(--chip)}
.course-card:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.cc-main{flex:1;min-width:0;display:grid;gap:4px}
.cc-side{display:flex;align-items:center;gap:6px}
.cc-side .danger{min-height:36px;min-width:36px;padding:4px 8px;border-color:transparent;background:transparent;color:var(--muted)}
.cc-side .danger:hover{color:var(--bad)}
.cc-side .danger.armed{background:var(--bad);color:#fff}
.chev-r{font-size:1.8rem;line-height:1;color:var(--muted)}
.course-card.dragging{opacity:.35}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;margin:0;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:rotate(-1.5deg) scale(1.02);background:var(--surface)!important}
.year.drop{outline:3px dashed var(--accent);outline-offset:2px;background:var(--chip)}
.newcourse{display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding-top:12px;border-top:1px solid var(--line)}
.tpl-list button small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.meas{display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.meas label{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:1rem}
.meas label .w{color:var(--muted);font-weight:500;font-size:.82rem}
.meas-row{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;align-items:stretch}
.meas-row input{font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;min-height:52px}
.meas-res{display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:10px;background:var(--chip);font-family:var(--font-display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;padding:4px 6px;text-align:center}
.meas-res small{font-family:var(--font-body);font-size:.75rem;font-weight:500;opacity:.85}
.meas-res .muted{color:var(--muted)}
.meas-res.bad-input{background:var(--bad-bg);color:var(--bad)}
.meas-res.tone-good{background:var(--good-bg)}
.meas-res.tone-mid{background:var(--mid-bg)}
.meas-res.tone-bad{background:var(--bad-bg)}
details.thr summary{cursor:pointer;color:var(--accent);font-size:.88rem;width:max-content}
.thr-grid{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted);padding-top:6px;font-variant-numeric:tabular-nums}
.disc-list{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.source{font-size:.82rem;color:var(--muted);max-width:70ch}

.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:8px 10px}
.icon-btn.ghost{background:transparent;border-color:transparent;color:var(--ink)}
.icon-btn.ghost:hover{background:var(--chip)}
.icon-btn.small{min-height:36px;min-width:36px;padding:4px 6px}
.icon-btn.small .ic{width:20px;height:20px}
.icon-btn.big .ic{width:26px;height:26px}
.icon-btn.big{min-width:56px;min-height:52px;color:var(--accent)}
.icon-btn.danger{color:var(--muted)}
.icon-btn.danger:hover{color:var(--bad);border-color:var(--bad)}
.icon-btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.icon-btn .q{font-weight:700}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn.next .ic{width:28px;height:28px}
.push{margin-left:auto}
.topbar h1{flex:0 1 auto;text-transform:none}
.course-card h2{text-transform:none}
.tabs button{display:flex;align-items:center;justify-content:center}
.tabs button .ic{width:26px;height:26px}
.year-head .chev{width:auto;color:var(--accent)}
.year-head .chev .ic{width:26px;height:26px}
.sport{width:44px;height:44px;border-radius:12px;background:var(--surface);color:var(--accent);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.sport .ic{width:26px;height:26px}
.sport.empty{visibility:hidden;width:0;border:0;margin-right:-10px}
.chips button{display:inline-flex;align-items:center;gap:6px}
.chips .chip-ic{width:18px;height:18px}
.chips .icon-btn.add{border-style:dashed;color:var(--accent);border-radius:999px;min-width:44px}
.tpl-list button{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center}
.tpl-list button small{grid-column:2}
.tpl-ic{width:26px;height:26px;color:var(--accent);grid-row:span 2}
.filebtn{gap:8px;padding:10px 14px}
.filebtn .ic{width:24px;height:24px}
.nc-title{flex-basis:100%}
.letters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.letter{position:relative;display:inline-flex!important;align-items:center;justify-content:center;min-width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--font-display);font-size:1.25rem;font-weight:700;cursor:pointer}
.letter input[type=checkbox]{position:absolute;opacity:0;inset:0;width:100%;height:100%;min-height:0;margin:0;cursor:pointer}
.letter:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.letter:has(input:focus-visible){outline:3px solid var(--mark);outline-offset:2px}
.letter.add{border-style:dashed;color:var(--accent)}
.letter.add input{width:44px;height:44px;min-height:0;border:none;background:transparent;text-align:center;font:inherit;color:inherit;padding:0}
.letter.add input::placeholder{color:var(--accent);opacity:1}
.course-edit{gap:12px}

.undo-bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 8px 6px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;max-width:calc(100% - 32px)}
.icon-btn.inv{color:var(--bg)}
.icon-btn.inv:hover{background:rgba(255,255,255,.12)}
.trash-zone{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;justify-content:center;gap:10px;height:72px;border:2px dashed var(--bad);border-radius:16px;background:var(--bad-bg);color:var(--bad);font-weight:600;transition:transform .12s,background .12s}
.trash-zone .ic{width:28px;height:28px}
.trash-zone.drop{background:var(--bad);color:#fff;transform:scale(1.03)}
.status-menu{position:fixed;z-index:70;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:6px;display:grid;gap:2px}
.status-menu .sm-title{font-size:.8rem;color:var(--muted);padding:6px 10px 4px}
.status-menu button{border:none;background:transparent;text-align:left;font-weight:600;border-radius:10px}
.status-menu button:hover{background:var(--chip)}
.status-menu button.on{background:var(--ink);color:var(--bg)}
.stu{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.inline-edit{border:1px solid transparent;background:transparent;padding:4px 6px;margin:-4px -6px;min-height:0;border-radius:8px;font:inherit;color:inherit;width:100%;font-weight:600}
.inline-edit:hover{border-color:var(--line)}
.inline-edit:focus{border-color:var(--accent);background:var(--surface);outline:none}
.inline-title{font-family:var(--font-display);font-size:1.45rem;font-weight:700;flex:1;min-width:0}
.crit-head .inline-edit{flex:1;min-width:0}
.linkish{border:none;background:transparent;color:var(--accent);font-weight:600;padding:8px 0 0;min-height:0;text-decoration:underline}
.actions{grid-template-columns:auto 1fr auto!important;align-items:center}
.actions .next{min-width:96px}
.swipe-hint{text-align:center;font-size:.8rem}
@media (pointer:fine){.swipe-hint{visibility:hidden}}
.pill.now{background:var(--accent);color:var(--accent-ink);margin-left:4px;font-family:var(--font-body)}
.panel.rating{scroll-margin-top:76px;touch-action:pan-y}
html,body{overscroll-behavior-x:none}
td.jump{cursor:pointer}
td.jump:hover{background:var(--chip)}
@keyframes slideL{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
.slide-left{animation:slideL .22s ease-out}
.slide-right{animation:slideR .22s ease-out}

.palette{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 2px 12px;margin:0 -2px 6px;background:var(--bg);touch-action:pan-x;scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.pal-item{flex:none;width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pal-item .ic{width:28px;height:28px}
.pal-item.dragging{opacity:.35}
.badges{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;align-items:center}
.badge{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--accent);display:grid;place-items:center;-webkit-touch-callout:none}
.badge .ic{width:22px;height:22px}
.badge.dragging{opacity:.3}
.small-hint{font-size:.82rem}
.course-card.drop{outline:3px dashed var(--accent);outline-offset:2px;background:var(--chip)}
.drag-ghost.ghost-sport,.drag-ghost.ghost-badge{border-radius:14px;transform:scale(1.25)}
.sportbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.sportbar::-webkit-scrollbar{display:none}
.sp{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;min-width:48px;border-radius:14px;padding:8px 10px;color:var(--accent)}
.sp .ic{width:26px;height:26px}
.sp.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;padding-right:14px}
.sportbar .add{border-style:dashed;color:var(--accent);border-radius:14px;min-height:48px}
.sp-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.sp-tile{display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:14px;color:var(--ink);font-size:.85rem;font-weight:600;text-align:center}
.sp-tile .ic{width:30px;height:30px;color:var(--accent)}
.sp-tile.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sp-tile.on .ic{color:var(--accent-ink)}
th .th-ic{display:flex;justify-content:center;color:var(--accent)}
th .th-ic .ic{width:22px;height:22px}

.flash-bar{padding:12px 18px;pointer-events:none}
body.is-dragging .undo-bar{display:none}
@keyframes pop{0%{transform:scale(.4);background:var(--accent);color:var(--accent-ink)}60%{transform:scale(1.25);background:var(--accent);color:var(--accent-ink)}100%{transform:scale(1)}}
.badge.pop{animation:pop .5s ease-out}

.newcourse{display:flex;flex-wrap:nowrap;gap:8px;align-items:stretch;padding-top:12px;border-top:1px solid var(--line)}
.course-edit .newcourse{border-top:none;padding-top:0}
.nc-jg{flex:0 0 84px}
.nc-jg select{font-family:var(--font-display);font-size:1.3rem;font-weight:700;padding:8px 10px}
.nc-let{flex:1 1 auto;min-width:0}
.nc-let input{font-family:var(--font-display);font-size:1.3rem;font-weight:700;letter-spacing:.06em}
.nc-let input::placeholder{font-family:var(--font-body);font-size:1rem;font-weight:400;letter-spacing:0}

.year-head{touch-action:manipulation;cursor:pointer;min-height:56px;-webkit-tap-highlight-color:transparent;border-radius:10px}
.year-head:active{background:var(--chip)}
.year-head .fold{display:grid;place-items:center;width:32px;height:32px;color:var(--muted);transition:transform .18s}
.year-head .fold .ic{width:20px;height:20px}
.year-head .fold.open{transform:rotate(90deg)}
.year-head .count{margin-left:auto}

.note-btn{position:relative;margin-left:auto;padding:6px 8px;min-width:44px}
.note-btn.on{background:var(--chip)}
.note-count{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;display:grid;place-items:center}
.panel-head h2{flex:0 1 auto}
.notes{display:grid;gap:8px;padding:10px 0 2px;border-top:1px solid var(--line)}
.note-add{display:flex;gap:8px}
.note-add input{flex:1;min-width:0}
.note-list{list-style:none;margin:0;padding:0;display:grid}
.note-list li{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.note-list li:last-child{border-bottom:none}
.note-date{color:var(--muted);font-size:.85rem;min-width:44px}
.note-sp{width:20px;color:var(--accent);flex:none}
.note-sp .ic{width:18px;height:18px}
.note-text{flex:1;min-width:0;overflow-wrap:anywhere}
.note-list .icon-btn{min-height:36px;min-width:36px;padding:4px;border-color:transparent;background:transparent}
.src-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.88rem;font-weight:600;color:var(--accent);text-decoration:none}
.src-link .ic{width:16px;height:16px}
.src-link:hover{text-decoration:underline}

const num=s=>{const n=parseFloat(String(s).replace(',','.'));return isFinite(n)?n:null;};
function parseVal(key,text){
  const t=String(text||'').trim();if(!t) return null;
  const type=DISC[key].type;let v=null;
  if(type==='ms'||type==='mst'){
    if(!/^[\d:.,\s]+$/.test(t)) return null;
    const p=t.split(/[:.,]/).map(x=>x.trim()).filter(x=>x!=='');
    if(p.length===3) v=Number(p[0])*60+Number(p[1])+Number('0.'+p[2]);
    else if(p.length===2){
      if(type==='mst'&&p[1].length<=1) v=Number(p[0])+Number('0.'+p[1]);
      else v=Number(p[0])*60+Number(p[1]);
    }
    else if(p.length===1){const n=Number(p[0]);v=(type==='ms'&&n<30)?n*60:n;}
  } else {
    if(!/^[\d.,\s]+$/.test(t)) return null;
    v=num(t);
    if(type==='jump'&&v!=null&&v>=10) v=v/100; // in cm eingegeben
  }
  return (v!=null&&isFinite(v)&&v>0)?Math.round(v*100)/100:null;
}
function clock(v,dec){
  const m=Math.floor(v/60+1e-9);let s=v-m*60;
  let ss=s.toFixed(dec).replace('.',',');if(s<10) ss='0'+ss;
  return `${m}:${ss}`;
}
function fmtVal(key,v,withUnit=true){
  if(v==null) return '';
  const type=DISC[key].type;
  const de=(x,a,b)=>x.toLocaleString('de-DE',{minimumFractionDigits:a,maximumFractionDigits:b});
  if(type==='s') return de(v,1,2)+(withUnit?' s':'');
  if(type==='m'||type==='jump') return de(v,2,2)+(withUnit?' m':'');
  if(type==='int') return de(v,0,0)+(withUnit?' m':'');
  if(type==='min') return de(v,0,1)+(withUnit?' min':'');
  if(type==='ms') return clock(v,v%1?1:0)+(withUnit?' min':'');
  return clock(v,1)+(withUnit?' min':'');
}

/* ---------- Berechnung ---------- */
function compute(c,sheet,sid){
  const r=sheet.ratings[sid];
  if(!r) return {state:'none'};
  if(r.status==='fehlt'||r.status==='befreit') return {state:r.status};
  if(sheet.type==='mess'){
    const keys=sheet.discs.filter(k=>r.vals?.[k]!=null&&thresholds(k,c.jgst));
    if(!keys.length) return {state:'none'};
    const sc=keys.map(k=>score(k,r.vals[k],c.jgst,sheet.aa));
    const need=Math.max(1,Math.min(sheet.need||1,sheet.discs.length));
    return {state:keys.length>=need?'done':'partial',value:sc.reduce((a,b)=>a+b,0)/sc.length,n:keys.length,total:need};
  }
  let sw=0,sv=0,n=0;
  for(const cr of sheet.criteria){
    const v=r.vals?.[cr.id];
    if(v===undefined||v===null) continue;
    n++;const w=Number(cr.weight)||0;sw+=w;sv+=v*w;
  }
  if(n===0) return {state:'none'};
  return {state:n===sheet.criteria.length?'done':'partial',value:sw>0?sv/sw:null,n,total:sheet.criteria.length};
}

    const r=compute(c,s,sid);
    if(r.state==='done'&&r.value!=null){const w=Number(s.weight)||0;sw+=w;sv+=r.value*w;}
    else if(r.state==='partial') partial=true;
    else if(r.state==='fehlt'||r.state==='befreit') away=r.state;
  }
  return {value:sw>0?sv/sw:null,partial,away};
}
/* Gesamtnote: alle Sportarten zählen gleich */
function overall(c,sid){
  const vals=classSports(c).map(k=>sportGrade(c,k,sid).value).filter(v=>v!=null);
  return vals.length?{value:vals.reduce((a,b)=>a+b,0)/vals.length,count:vals.length}:{value:null,count:0};
}
function fmt(v,scale){
  if(v==null||isNaN(v)) return '–';
  return scale==='punkte'
    ? v.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' P'
    : v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function tone(v,scale){
  if(v==null) return '';
  const n=scale==='punkte'?(17-v)/3:v;
  return n<=2.5?'tone-good':n<=4.5?'tone-mid':'tone-bad';
}

function jgSelect(id,name,value){

function jgShort(id,name,value,attrs=''){

/* Klassen in natürlicher Reihenfolge: erst Jahrgangsstufe als Zahl, dann Buchstaben (5a, 5b, 7cd, 11ab, Q12) */
function sortCourses(list){
  return [...list].sort((a,b)=>(a.jgst-b.jgst)||(a.letters||[]).join('').localeCompare((b.letters||[]).join(''),'de')||String(a.name||'').localeCompare(String(b.name||''),'de',{numeric:true}));
}
function backupDue(){
  if(!allCourses().some(c=>c.students.length)) return false;
  return !state.lastBackup||Date.now()-state.lastBackup>14*864e5;
}
async function doBackup(){
  const d=new Date().toISOString().slice(0,10);
  const data=JSON.stringify({app:'sportnoten',version:3,saved:new Date().toISOString(),state},null,1);
  const name=`sportnoten-sicherung-${d}.json`;
  const file=new File([data],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sportnoten-Sicherung'});}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
    state.lastBackup=Date.now();save();flash('Sicherung erstellt');
  }catch(e){if(e&&e.name!=='AbortError')flash('Sicherung hat nicht geklappt');}
  render();
}
async function doRestore(f){
  try{
    const obj=JSON.parse(await f.text());
    const st=obj&&obj.app==='sportnoten'?obj.state:null;
    if(!st||!Array.isArray(st.years)) throw new Error('format');
    const snap=JSON.stringify(state);
    state=st;if(!Array.isArray(state.letters))state.letters=['a','b','c','d','e'];
    state.years.forEach(y=>y.courses.forEach(c=>{normCourse(c);if(!Array.isArray(c.sports))c.sports=[];}));
    save();ui.courseId=null;
    ui.undo={snap,text:'Sicherung geladen'};clearTimeout(undoTimer);undoTimer=setTimeout(()=>{ui.undo=null;render();},10000);
  }catch(e){flash('Das ist keine Sportnoten-Sicherung');}
  render();
}

/* ---------- PDF-Import ---------- */
const PDFJS='vendor/pdfjs/';
let pdfReady=null;
function loadScript(src){
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Skript nicht geladen'));document.head.appendChild(s);});
}
function loadPdfJs(){
  if(!pdfReady){
    pdfReady=(async()=>{
      await loadScript(PDFJS+'pdf.min.js');
      await loadScript(PDFJS+'pdf.worker.min.js'); // läuft im Hauptthread, kein separater Worker nötig
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
      return window.pdfjsLib;
    })().catch(e=>{pdfReady=null;throw e;});
  }
  return pdfReady;
}
async function pdfLines(file){
  const lib=await loadPdfJs();
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str.replace(/\s+/g,' ').trim(),x:i.transform[4],y:i.transform[5],w:i.width||0}));
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    const lines=[];
    for(const it of items){
      const L=lines.find(l=>Math.abs(l.y-it.y)<3);
      if(L) L.items.push(it); else lines.push({y:it.y,items:[it],page:p});
    }
    lines.forEach(l=>l.items.sort((a,b)=>a.x-b.x));
    out.push(...lines);
  }
  return out;
}
function joinItems(items){
  let s='';
  items.forEach((it,i)=>{
    if(i>0){const prev=items[i-1];s+=(it.x-(prev.x+prev.w)>1)?' ':'';}
    s+=it.s;
  });
  return s.replace(/\s+/g,' ').trim();
}
const norm=s=>s.toLowerCase().replace(/[^a-zäöüß]/g,'');
const STOP=new Set(['klasse','klassenliste','klassenleitung','schuljahr','seite','stand','gymnasium','schule','realschule','mittelschule','grundschule','liste','teilnehmerliste','schülerliste','kurs','sport','sporthalle','halle','lehrkraft','lehrer','datum','name','vorname','nachname','rufname','familienname','gruppe','stunde','montag','dienstag','mittwoch','donnerstag','freitag','badminton','schwimmen','mädchen','jungen','bemerkung','bemerkungen','geburtsdatum','geschlecht','summe','gesamt','insgesamt','anzahl','schüler','schülerin','schülerinnen','unterschrift','nr','und','oder','ausdruck','export','webuntis','fach','zeugnis']);
const PARTICLES=new Set(['von','van','de','la','le','del','della','der','den','zu','zur','di','da','dos','el','al','ten','ter','du','bin','ibn']);
function isNamePart(s){
  if(!s||s.length<2||s.length>45) return false;
  if(!/^[\p{L}\p{M}][\p{L}\p{M}'’.\- ]*$/u.test(s)) return false;
  const words=s.split(' ');
  if(!words.some(w=>/^\p{Lu}/u.test(w))) return false;
  if(words.some(w=>!/^\p{Lu}/u.test(w)&&!PARTICLES.has(w))) return false;
  if(words.some(w=>STOP.has(norm(w)))) return false;
  return true;
}
function splitFull(s,order){
  if(s.includes(',')){const [a,...b]=s.split(',');return {last:a.trim(),first:b.join(',').trim()};}
  const w=s.split(' ');
  if(order==='last-first'){
    // Nachname kann mit Namenszusatz beginnen (von Bergen)
    let k=1;while(k<w.length-1&&PARTICLES.has(w[k-1]))k++;
    return {last:w.slice(0,k).join(' '),first:w.slice(k).join(' ')};
  }
  let k=w.length-1;while(k>1&&PARTICLES.has(w[k-1]))k--;
  return {first:w.slice(0,k).join(' '),last:w.slice(k).join(' ')};
}
function extractNames(lines){
  // 1) Tabellenkopf suchen
  let header=null,lastCol=-1,firstCol=-1,fullCol=-1,order='first-last';
  for(const l of lines){
    const ns=l.items.map(i=>norm(i.s));
    const li=ns.findIndex(n=>n==='nachname'||n==='familienname'||n==='name');
    const fi=ns.findIndex(n=>n.startsWith('vorname')||n==='rufname');
    const lt=norm(joinItems(l.items));
    if(lt.includes('nachname')&&lt.includes('vorname')&&lt.indexOf('nachname')<lt.indexOf('vorname')) order='last-first';
    if(li>=0&&fi>=0&&li!==fi){header=l;lastCol=li;firstCol=fi;break;}
    const ci=ns.findIndex(n=>['namevorname','nachnamevorname','vornamenachname','schülername','schülerin','schülerinschüler','schüler'].includes(n));
    if(ci>=0){header=l;fullCol=ci;if(ns[ci].startsWith('vorname'))order='first-last';else if(ns[ci].includes('vorname'))order='last-first';break;}
  }
  const found=[];const seen=new Set();
  const add=(first,last)=>{
    first=first.trim();last=last.trim();
    if(!isNamePart(first)||!isNamePart(last)) return;
    const key=(first+'|'+last).toLowerCase();if(seen.has(key))return;seen.add(key);
    found.push({first,last});
  };
  if(header){
    const starts=header.items.map(i=>i.x-6);
    const colOf=x=>{let k=0;for(let j=0;j<starts.length;j++)if(x>=starts[j])k=j;return k;};
    const hText=norm(joinItems(header.items));
    const startIdx=lines.indexOf(header);
    for(const l of lines.slice(startIdx+1)){
      if(norm(joinItems(l.items))===hText) continue; // wiederholter Kopf auf Folgeseiten
      const cols={};
      l.items.forEach(it=>{const k=colOf(it.x);(cols[k]=cols[k]||[]).push(it);});
      const get=k=>cols[k]?joinItems(cols[k]):'';
      if(fullCol>=0){const t=get(fullCol);if(t){const r=splitFull(t,order);add(r.first,r.last);}}
      else add(get(firstCol),get(lastCol));
    }
    if(found.length) return {rows:found,method:fullCol>=0?'Tabelle mit Namensspalte':'Tabelle mit Spalten Nachname und Vorname'};
  }
  // 2) Ohne Tabellenkopf: jede Zeile einzeln prüfen
  for(const l of lines){
    let t=joinItems(l.items);
    t=t.replace(/^\s*\d{1,3}\s*[.)]?\s+/,'');
    t=t.replace(/\b\d{1,2}\.\d{1,2}\.(\d{2,4})?/g,' ');
    t=t.split(' ').filter(w=>w&&!/[\d@]/.test(w)&&!/^[a-zäöü]$/.test(w)).join(' ').trim();
    if(!t) continue;
    if(t.includes(',')){const r=splitFull(t,order);add(r.first,r.last);continue;}
    const words=t.split(' ');
    if(words.length<2||words.length>5) continue;
    const r=splitFull(t,order);add(r.first,r.last);
  }
  return {rows:found,method:'Zeilenweise (kein Tabellenkopf gefunden)'};
}
function fmtName(r,format,firstOnly){
  let first=r.first;
  if(firstOnly) first=first.split(' ')[0];
  if(format==='last-first') return `${r.last}, ${first}`;
  if(format==='first-initial'){
    const main=r.last.split(' ').find(w=>/^\p{Lu}/u.test(w))||r.last;
    return `${first} ${main[0]}.`;
  }
  return `${first} ${r.last}`;
}
async function handlePdf(file){
  ui.imp={loading:true,fileName:file.name};ui.toast=null;render();
  try{
    const lines=await pdfLines(file);
    if(!lines.length){ui.imp={fileName:file.name,error:'In diesem PDF steht kein lesbarer Text. Vermutlich ist es eingescannt. Scans kann der Prototyp noch nicht lesen.'};}
    else{
      const res=extractNames(lines);
      if(!res.rows.length) ui.imp={fileName:file.name,error:'Im PDF habe ich keine Namen gefunden. Am besten klappt eine Liste mit Spalten „Nachname“ und „Vorname“ oder Zeilen wie „Muster, Max“.'};
      else ui.imp={fileName:file.name,method:res.method,rows:res.rows.map(r=>({...r,checked:true})),format:'first-last',firstOnly:false};
    }
  }catch(err){
    ui.imp={fileName:file.name,error:err&&/Skript/.test(err.message)?'Der PDF-Leser konnte nicht geladen werden. Bitte Internetverbindung prüfen und nochmal versuchen.':'Das PDF ließ sich nicht öffnen. Ist es passwortgeschützt oder beschädigt?'};
  }
  render();
  const p=document.getElementById('pdf-import');if(p)p.scrollIntoView({block:'start'});
}

let undoTimer=null,flashTimer=null;
function flash(text){ui.flash=text;clearTimeout(flashTimer);flashTimer=setTimeout(()=>{ui.flash=null;ui.justAdded=null;render();},2200);}
const DEL_TEXT={note:'Notiz gelöscht',sport:'Sportart entfernt',wipe:'Alles gelöscht',year:'Schuljahr gelöscht',course:'Kurs gelöscht',sheet:'Bogen gelöscht',stu:'Schüler entfernt'};
function deleteWithUndo(key){
  const snap=JSON.stringify(state);
  const kind=key.split(':')[0];
  runConfirmed(key);
  if(kind==='course'&&ui.courseId===key.slice(7)){ui.courseId=null;ui.editCourse=false;}
  ui.undo={snap,text:DEL_TEXT[kind]||'Gelöscht'};
  clearTimeout(undoTimer);undoTimer=setTimeout(()=>{ui.undo=null;render();},7000);
}
function undoHtml(){
  if(!ui.undo&&ui.flash) return `<div class="undo-bar flash-bar" role="status"><span>${esc(ui.flash)}</span></div>`;
  if(!ui.undo) return '';
  return `<div class="undo-bar" role="status"><span>${esc(ui.undo.text)}</span>${ib('reload','Rückgängig','data-action="undo"','ghost inv')}</div>`;
}
function runConfirmed(key){
  const [kind,id]=key.split(/:(.+)/);
  if(kind==='note'){
    const [cid,sid,nid]=id.split(':');const cc=allCourses().find(x=>x.id===cid);
    if(cc&&cc.notes&&cc.notes[sid]) cc.notes[sid]=cc.notes[sid].filter(n=>n.id!==nid);
    save();return;
  }
  if(kind==='sport'){
    const [cid,k]=id.split(':');const cc=allCourses().find(x=>x.id===cid);
    if(cc){cc.sports=(cc.sports||[]).filter(x=>x!==k);cc.sheets=cc.sheets.filter(s=>(sheetSport(s)||'misc')!==k);if(ui.sportId===k)ui.sportId=null;}
    save();return;
  }
  const c=course();
  if(kind==='wipe'){state={letters:state.letters,years:[{id:uid(),name:currentSY(),open:true,courses:[]}]};}
  else if(kind==='year'){state.years=state.years.filter(y=>y.id!==id);}
  else if(kind==='course'){state.years.forEach(y=>y.courses=y.courses.filter(x=>x.id!==id));}
  else if(kind==='sheet'&&c){c.sheets=c.sheets.filter(x=>x.id!==id);if(ui.sheetId===id)ui.sheetId=null;if(ui.editSheetId===id)ui.editSheetId=null;}
  else if(kind==='stu'&&c){c.students=c.students.filter(x=>x.id!==id);c.sheets.forEach(s=>delete s.ratings[id]);if(ui.studentId===id)ui.studentId=null;}
  save();
}
function moveCourse(cid,yid){
  const from=yearOf(cid),to=state.years.find(y=>y.id===yid);
  if(!from||!to||from===to) return;
  const c=from.courses.find(x=>x.id===cid);
  from.courses=from.courses.filter(x=>x.id!==cid);to.courses.push(c);to.open=true;save();
}
function goNextOpen(c,sheet){
  const n=c.students.length,i=c.students.findIndex(s=>s.id===ui.studentId);
  let target=null;
  for(let k=1;k<=n;k++){const s=c.students[(i+k)%n];const st=compute(c,sheet,s.id).state;if(st==='none'||st==='partial'){target=s;break;}}
  ui.studentId=(target||c.students[(i+1)%n]).id;ui.focusMeas=true;ui.slide='left';scrollPanel();
}
function goStep(c,dir){
  const n=c.students.length,i=c.students.findIndex(s=>s.id===ui.studentId);

function maybeAutoAdvance(c,sheet,sid,delay){

/* Ziehen & Ablegen von Kurskarten in Schuljahr-Ordner
   Finger: gedrückt halten (0,35 s), dann ziehen · Maus: einfach ziehen */
let drag=null,suppressClick=false;
const DROP_SEL={course:'[data-drop],[data-trash]',sport:'[data-drop-course]',badge:'[data-trash]'};
function dragSource(target){
  if(target.closest('button,input,select,textarea,label')) return null;
  const el=target.closest('[data-badge],[data-drag-sport],[data-drag]');if(!el) return null;
  if(el.dataset.badge) return {kind:'badge',el,id:el.dataset.badge,cid:el.dataset.course};
  if(el.dataset.dragSport) return {kind:'sport',el,id:el.dataset.dragSport};
  return {kind:'course',el,id:el.dataset.drag,cid:el.dataset.drag};
}
function dropTargetAt(x,y){
  const el=document.elementFromPoint(x,y);let t=el?el.closest(DROP_SEL[drag.kind]):null;
  if(t||drag.kind!=='sport') return t;
  const cards=[...app.querySelectorAll('[data-drop-course]')];
  const g=drag.ghost?drag.ghost.getBoundingClientRect():null;
  const pts=[[x,y]];if(g) pts.push([g.left+g.width/2,g.top+g.height/2]);
  for(const [px,py] of pts){const hit=cards.find(c=>{const r=c.getBoundingClientRect();return px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom;});if(hit) return hit;}
  let best=null,bd=48;
  cards.forEach(c=>{const r=c.getBoundingClientRect();const dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom);const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=c;}});
  return best;
}
function beginDrag(){
  cleanupDragArtifacts();
  if(!drag.el.isConnected){drag=null;return;}
  const r=drag.el.getBoundingClientRect();
  drag.offX=drag.x-r.left;drag.offY=drag.y-r.top;
  const g=drag.el.cloneNode(true);g.classList.remove('pop');g.classList.add('drag-ghost','ghost-'+drag.kind);
  document.body.classList.add('is-dragging');
  ['data-drag','data-drop-course','data-badge','data-drag-sport','data-action'].forEach(a=>g.removeAttribute(a));
  g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);drag.ghost=g;drag.el.classList.add('dragging');drag.active=true;
  if(drag.kind!=='sport'){
    const tz=document.createElement('div');tz.className='trash-zone';tz.dataset.trash='1';
    tz.innerHTML=ic('trash')+`<span>${drag.kind==='badge'?'Sportart entfernen':'Zum Löschen hierher ziehen'}</span>`;
    document.body.appendChild(tz);drag.trash=tz;
  }
  try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
  const tick=()=>{if(!drag||!drag.active)return;
    const edge=70;let dy=0;
    if(drag.y<edge) dy=-Math.ceil((edge-drag.y)/6); else if(drag.y>innerHeight-edge) dy=Math.ceil((drag.y-(innerHeight-edge))/6);
    if(dy){window.scrollBy(0,dy);markTarget();}
    requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}
function markTarget(){
  const t=dropTargetAt(drag.x,drag.y);
  document.querySelectorAll('.drop').forEach(el=>{if(el!==t)el.classList.remove('drop');});
  if(t) t.classList.add('drop');drag.target=t;
}
function moveDragTo(x,y){drag.x=x;drag.y=y;drag.ghost.style.left=(x-drag.offX)+'px';drag.ghost.style.top=(y-drag.offY)+'px';markTarget();}
function finishDrag(cancel){
  const d=drag;drag=null;if(!d) return false;clearTimeout(d.timer);
  detachSourceListeners(d);
  if(!d.active) return false;
  if(d.ghost)d.ghost.remove();if(d.trash)d.trash.remove();
  cleanupDragArtifacts();
  const t=cancel?null:d.target;
  if(cancel){render();return true;}
  if(d.kind==='course'){
    if(t&&t.dataset.trash) deleteWithUndo('course:'+d.cid);
    else if(t) moveCourse(d.cid,t.dataset.drop);
  } else if(d.kind==='sport'){
    const c=t&&allCourses().find(x=>x.id===t.dataset.dropCourse);
    if(!c) flash('Nicht auf einer Klasse abgelegt');
    else if(classSports(c).includes(d.id)) flash(`${SPORT_LABEL[d.id]} ist bei ${cName(c)} schon dabei`);
    else{c.sports.push(d.id);save();ui.justAdded={cid:c.id,k:d.id};flash(`${SPORT_LABEL[d.id]} → ${cName(c)}`);}
  } else if(d.kind==='badge'&&t&&t.dataset.trash){
    deleteWithUndo('sport:'+d.cid+':'+d.id);
  }
  render();return true;
}
function detachSourceListeners(d){
  if(d&&d.srcNode&&d.handlers){d.srcNode.removeEventListener('touchmove',d.handlers.move);d.srcNode.removeEventListener('touchend',d.handlers.end);d.srcNode.removeEventListener('touchcancel',d.handlers.cancel);}
}
app.addEventListener('touchstart',e=>{
  // eine hängengebliebene Ziehaktion wird bei jeder neuen Berührung abgebrochen
  if(drag&&drag.active){finishDrag(true);}
  else if(drag){clearTimeout(drag.timer);detachSourceListeners(drag);drag=null;}
  cleanupDragArtifacts();
  if(e.touches.length>1) return;
  const src=dragSource(e.target);if(!src) return;
  const t=e.touches[0];
  drag={...src,x:t.clientX,y:t.clientY,sx:t.clientX,sy:t.clientY,active:false,touch:true,srcNode:e.target};
  drag.handlers={move:onTouchMove,end:onTouchEnd,cancel:onTouchCancel};
  e.target.addEventListener('touchmove',onTouchMove,{passive:false});
  e.target.addEventListener('touchend',onTouchEnd);
  e.target.addEventListener('touchcancel',onTouchCancel);
  drag.timer=setTimeout(()=>{if(drag&&!drag.active)beginDrag();},350);
},{passive:true,capture:true});
function onTouchEnd(e){if(drag&&drag.touch){if(finishDrag())e.preventDefault();}}
function onTouchCancel(){if(drag&&drag.touch){finishDrag(true);}}
function onTouchMove(e){
  if(!drag||!drag.touch||e._sn) return;e._sn=true;
  const t=e.touches[0];
  if(!drag.active){
    const dx=t.clientX-drag.sx,dy=t.clientY-drag.sy;
    if(Math.hypot(dx,dy)<=8) return;
    // Sportart aus der Leiste: nach unten/oben ziehen startet sofort, seitlich scrollt die Leiste
    if(drag.kind==='sport'&&Math.abs(dy)>Math.abs(dx)){clearTimeout(drag.timer);beginDrag();}
    else{clearTimeout(drag.timer);drag=null;return;}
  }
  if(!drag||!drag.active) return;
  e.preventDefault();moveDragTo(t.clientX,t.clientY);
}
document.addEventListener('touchmove',onTouchMove,{passive:false});
document.addEventListener('touchend',onTouchEnd);
document.addEventListener('touchcancel',onTouchCancel);
/* Sicherheitsnetz: App verlassen oder Mausziehen abgebrochen → Ziehen beenden */
document.addEventListener('visibilitychange',()=>{if(document.hidden&&drag)finishDrag(true);});
window.addEventListener('blur',()=>{if(drag)finishDrag(true);});
document.addEventListener('pointercancel',e=>{if(drag&&!drag.touch)finishDrag(true);});
app.addEventListener('pointerdown',e=>{
  suppressClick=false;
  if(e.pointerType!=='mouse'||e.button!==0) return;
  const src=dragSource(e.target);if(!src) return;
  drag={...src,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,active:false,touch:false};
});
document.addEventListener('pointermove',e=>{
  if(!drag||drag.touch) return;
  if(!drag.active){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;drag.x=e.clientX;drag.y=e.clientY;beginDrag();}
  moveDragTo(e.clientX,e.clientY);
});
document.addEventListener('pointerup',()=>{if(drag&&!drag.touch){if(finishDrag()){suppressClick=true;setTimeout(()=>{suppressClick=false;},60);}else drag=null;}});
app.addEventListener('contextmenu',e=>{
  if(e.target.closest('[data-drag],[data-drag-sport],[data-badge]'))e.preventDefault();
  const st=e.target.closest('[data-stu]');
  if(st){e.preventDefault();openStatusMenu(st.dataset.stu,e.clientX,e.clientY);}
});
/* Gedrückthalten auf einen Namen: Menü Fehlt / Befreit (ohne Neuaufbau, damit der Finger-Vorgang intakt bleibt) */
function openStatusMenu(sid,x,y){
  ui.statusMenu={sid,x,y};ui.menuAt=Date.now();
  const old=app.querySelector('.status-menu');if(old)old.remove();
  app.insertAdjacentHTML('beforeend',statusMenuHtml());
}
let press=null;
app.addEventListener('touchstart',e=>{
  const st=e.target.closest('[data-stu]');if(!st||e.touches.length>1) return;
  const t=e.touches[0];
  press={sid:st.dataset.stu,x:t.clientX,y:t.clientY,fired:false};
  press.timer=setTimeout(()=>{if(!press)return;press.fired=true;try{navigator.vibrate&&navigator.vibrate(12);}catch(_){}openStatusMenu(press.sid,press.x,press.y);},500);
},{passive:true});
app.addEventListener('touchmove',e=>{if(!press)return;const t=e.touches[0];if(Math.hypot(t.clientX-press.x,t.clientY-press.y)>8){clearTimeout(press.timer);press=null;}},{passive:true});
app.addEventListener('touchend',e=>{if(!press)return;clearTimeout(press.timer);if(press.fired)e.preventDefault();press=null;});
/* Wischen im Bewertungsfeld: links = nächste Person, rechts = vorherige */
let swipe=null;
app.addEventListener('touchstart',e=>{const p=e.target.closest('[data-swipe]');if(!p||e.touches.length>1||e.target.closest('details'))return;const t=e.touches[0];swipe={x:t.clientX,y:t.clientY,t:Date.now()};},{passive:true});
app.addEventListener('touchend',e=>{
  if(!swipe) return;const t=e.changedTouches[0];const dx=t.clientX-swipe.x,dy=t.clientY-swipe.y,dt=Date.now()-swipe.t;swipe=null;
  if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*0.6||dt>700) return;
  const c=course();if(!c) return;
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  goStep(c,dx<0?1:-1);ui.focusMeas=false;render();
});

render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
})();
</script>
</body>
</html>
